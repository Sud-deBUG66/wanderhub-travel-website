<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanderhub Travel</title>
    <script src="https://kit.fontawesome.com/40f7dbf11a.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section id="home" class="header">
        <!---------logo---------->

        <nav class="navbar">
            <div class="logo">
                <strong><span>W</span>ander<span>H</span>ub</strong>
                <p style="color: rgb(182, 172, 172);">── Travel Made Simple ──</p>
            </div>

            <!---------navbar---------->

            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#destination">Destination</a></li>
                <li><a href="#experiences">Experience</a></li>
                <li><a href="#packages">Packages</a></li>
                <li><a href="#travel-guide">Travel-guide</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
            <div class="search-container">
                <input type="search" name="search" class="search-field" placeholder="Search your destination...">
                <button class="search-btn">
                    <i class="fa-brands fa-sistrix"></i>
                </button>
            </div>
            <div class="mobile-user">
                <div class="login">
                    <button type="button" class="icon" onclick="openModal(); return false;"><i
                            class="fa-regular fa-user"></i>
                        <span>Login | Sign</span>
                    </button>
                </div>
            </div>

            <!-----------------loginModal-------------------->
            <div id="loginModal" class="modal">
                <div class="modal-content">
                    <span class="close" onclick="closeModal()">&times;</span>
                    <div class="modal-logo">
                        <strong><span>W</span>ander<span>H</span>ub</strong>
                        <p style="color: white;">── Travel Made Simple ──</p>
                    </div>
                    <h2>Welcome Back🤝</h2>
                    <p class="login-text">
                        Login to continue with Wanderhub
                    </p>
                    <form>
                        <div class="input-box">
                            <label for="email">Email Address</label>
                            <i class="fa-regular fa-envelope"></i>
                            <input type="email" placeholder="Email Address" required>
                        </div>
                        <div class="input-box">
                            <label for="password">Password</label>
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" placeholder="Password" required>
                        </div>
                        <div class="login-options">
                            <label>
                                <input type="checkbox">Remember me
                            </label>
                            <a href="#">Forgot Password?</a>
                        </div>
                        <button class="btn1">
                            <i class="fa-solid fa-lock"></i> Login
                        </button>
                    </form>
                    <div class="divider">
                        <span>OR</span>
                    </div>
                    <button class="btn2">
                        <i class="fa-brands fa-google " style="color:#DB4437;"></i>
                        Continue with Google
                    </button>
                    <button class="btn2">
                        <i class="fa-brands fa-facebook" style="color:#1877F2;"></i>
                        Continue with Facebook
                    </button>
                    <button class="btn2">
                        <i class="fa-brands fa-github" style="color:#181717;"></i>
                        Continue with GitHub
                    </button>
                    <p class="signup-text">
                        Don't have an account?
                        <a href="#">Create Account</a>
                    </p>
                </div>
            </div>
        </nav>

        <!-----------------videos-------------------->
        <div class="video-section">
            <video id="videoPlayer" autoplay muted playsinline></video>

            <div class="controls">
                <button onclick="changeVideo(0)">India 360</button>
                <button onclick="changeVideo(1)">Adventure</button>
                <button onclick="changeVideo(2)">Heritage</button>
                <button onclick="changeVideo(3)">Spiritual</button>
            </div>

            <button id="muteBtn">🔇</button>
        </div>

        <!-----------------destination search box-------------------->
        <div class="box">
            <i class="fa-solid fa-location-dot"></i>
            <div class="fields">
                <label>Destination</label>
                <select id="state" onchange="updatePlaces()">
                    <option value="">Select State</option>
                    <option value="Andhra Pradesh">Andhra Pradesh</option>
                    <option value="Goa">Goa</option>
                    <option value="Gujarat">Gujarat</option>
                    <option value="Haryana">Haryana</option>
                    <option value="Karnataka">Karnataka</option>
                    <option value="Kerala">Kerala</option>
                    <option value="Maharashtra">Maharashtra</option>
                    <option value="Meghalaya">Meghalaya</option>
                    <option value="Nagaland">Nagaland</option>
                    <option value="Odisha">Odisha</option>
                    <option value="Punjab">Punjab</option>
                    <option value="Rajasthan">Rajasthan</option>
                    <option value="Tamil Nadu">Tamil Nadu</option>
                    <option value="Telangana">Telangana</option>
                    <option value="Tripura">Tripura</option>
                    <option value="Uttarakhand">Uttarakhand</option>
                    <option value="Uttar Pradesh">Uttar Pradesh</option>
                    <option value="West Bengal">West Bengal</option>
                </select>
            </div>

            <div class="fields">
                <label>Check-in</label>
                <input type="date">
                </select>
            </div>

            <div class="fields">
                <label>Check-out</label>
                <input type="date">
                </select>
            </div>
            <i class="fa-solid fa-user"></i>
            <div class="fields">
                <label>Guests</label>
                <input type="number" placeholder="0">
            </div>
            <a href="" class="search-btn5">Search</a>
        </div>

    </section>

    <script src="script.js"></script>

</body>

</html>
